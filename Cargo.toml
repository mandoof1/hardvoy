[package]
name = "hardvoy"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Operator opsec and fingerprint auditor: measure the leak surface an operator exposes on every egress path"
repository = "https://github.com/mandoof1/hardvoy"
keywords = ["opsec", "fingerprinting", "tor", "webrtc", "security"]
categories = ["command-line-utilities"]

[lib]
name = "hardvoy"
path = "src/lib.rs"

[[bin]]
name = "hardvoy"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
